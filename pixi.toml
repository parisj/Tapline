[workspace]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "VisioEval"
platforms = ["linux-64"]
version = "0.1.0"

[pypi-dependencies]
pytest = ">=8"
pytest-cov = ">=5"
pytest-timeout = ">=2.2"
confluent-kafka = ">=2.3"
minio = ">=7.2"
apache-flink = ">=1.18"
# Observability
opentelemetry-api = ">=1.20"
opentelemetry-sdk = ">=1.20"
opentelemetry-exporter-otlp = ">=1.20"
prometheus-client = ">=0.19"
# Visualization (Flask-based dashboard)
flask = ">=3.0"
flask-cors = ">=4.0"
requests = ">=2.31"
# Performance (optional, falls back to stdlib json)
orjson = ">=3.9"

[dependencies]
python = ">=3.12,<3.13"
python-dotenv = ">=1.2.1,<2"
numpy = ">=1.24.0,<2.2"
pytest = ">=9.0.2,<10"
ruff = ">=0.14.10,<0.15"

[tasks]
# Main pipeline components (can be run individually)
run = "python -m src.app.main"
aggregate-sink = "python -m src.app.aggregate_sink"
run-flink-job = "python src/flink/jobs/submit_job.py"

# Full pipeline (spawns all 3: main + flink job + aggregate sink)
pipeline = "python -m src.app.pipeline_runner"

# Legacy Python-based aggregation (not using Flink)
run-flink-agg = "python -m src.app.flink_aggregation"

# Testing
test = "pytest -q --cov=src --cov-report=term-missing"
test-e2e = "pytest tests/e2e -v --timeout=300"
test-all = "pytest tests/ -v"

# Code quality
lint = "ruff check ."
format = "ruff format ."

# Benchmarks
benchmark = "python -m benchmarks.load_generator"
benchmark-kafka = "python -m benchmarks.kafka_benchmark"

# Dashboard (Flask-based)
dashboard = "python -m src.visualization.api_server"