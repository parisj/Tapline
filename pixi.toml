[workspace]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "Tapline"
platforms = ["linux-64"]
version = "0.1.0"

[pypi-dependencies]
# Core
opencv-python = ">=4.8"
confluent-kafka = ">=2.3"
minio = ">=7.2"

# Observability
opentelemetry-api = ">=1.20"
opentelemetry-sdk = ">=1.20"
opentelemetry-exporter-otlp = ">=1.20"
prometheus-client = ">=0.19"

# Dashboard
flask = ">=3.0"
flask-cors = ">=4.0"
requests = ">=2.31"

# Performance (stdlib json fallback)
orjson = ">=3.9"

# Testing (pypi-only packages)
pytest-cov = ">=5"
pytest-timeout = ">=2.2"

# Security & quality
pip-audit = ">=2.7"
bandit = ">=1.7"
mypy = ">=1.14"
types-requests = ">=2.31"
pre-commit = ">=4.0"

[dependencies]
python = ">=3.12,<3.13"
python-dotenv = ">=1.2.1,<2"
numpy = ">=1.24.0,<2.2"
pytest = ">=9.0.2,<10"
ruff = ">=0.14.10,<0.15"

[tasks]
run = "python -m src.app.main"
aggregate-sink = "python -m src.app.aggregate_sink"
run-flink-job = "python src/flink/jobs/submit_job.py"
pipeline = "python -m src.app.pipeline_runner"
run-flink-agg = "python -m src.app.flink_aggregation"

test = "pytest -q --cov=src --cov-report=term-missing"
test-e2e = "pytest tests/e2e -v --timeout=300"
test-all = "pytest tests/ -v"
test-cov = "pytest -q --cov=src --cov-report=xml --cov-fail-under=80"

lint = "ruff check ."
format = "ruff format ."
typecheck = "mypy src --ignore-missing-imports"

security-audit = "pip-audit"
bandit-check = "bandit -r src -ll -q"

precommit-install = "pre-commit install"
precommit-run = "pre-commit run --all-files"

benchmark = "python -m benchmarks.load_generator"
benchmark-kafka = "python -m benchmarks.kafka_benchmark"

dashboard = "python -m src.visualization.api_server"

[feature.gpu]
platforms = ["linux-64"]

[feature.gpu.dependencies]
cuda-toolkit = ">=12.0"

[feature.gpu.pypi-dependencies]
opencv-contrib-python = ">=4.8"
onnxruntime-gpu = ">=1.16"

[feature.gpu.tasks]
check-gpu = "python -c \"from src.utils.gpu import check_gpu_status; check_gpu_status()\""

[feature.ml]
platforms = ["linux-64"]

[feature.ml.pypi-dependencies]
ultralytics = ">=8.0"
torch = ">=2.0"

[feature.ml.tasks]
test-yolo = "python -c \"from ultralytics import YOLO; print('YOLO available')\""

[environments]
default = { features = [], solve-group = "default" }
gpu = { features = ["gpu"], solve-group = "default" }
ml = { features = ["ml"], solve-group = "default" }
gpu-ml = { features = ["gpu", "ml"], solve-group = "default" }
