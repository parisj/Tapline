[workspace]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "VisioEval"
platforms = ["linux-64"]
version = "0.1.0"

[pypi-dependencies]
pytest = ">=8"
pytest-cov = ">=5"

[dependencies]
python-dotenv = ">=1.2.1,<2"
numpy = ">=2.4.0,<3"
pytest = ">=9.0.2,<10"
ruff = ">=0.14.10,<0.15"
psycopg = ">=3.3.2,<4"

[tasks]
run = "python -m src.app.main"
test = "pytest -q --cov=src --cov-report=term-missing"
lint = "ruff check ."
format = "ruff format ."