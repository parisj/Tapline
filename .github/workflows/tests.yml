name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.8.3
        with:
          cache: true

      - name: Lint
        run: pixi run lint

      - name: Format check
        run: pixi run ruff format --check src tests

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.8.3
        with:
          cache: true

      - name: Type check
        run: pixi run typecheck

  test:
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.8.3
        with:
          cache: true

      - name: Run tests with coverage
        run: pixi run test-cov

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency audit
        uses: google/osv-scanner-action@v2
        with:
          scan-args: |-
            --lockfile=pixi.lock

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.8.3
        with:
          cache: true

      - name: Code security analysis
        run: pixi run bandit-check
