global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # VisioEval pipeline metrics
  # On Linux, use Docker host gateway IP (172.17.0.1) instead of host.docker.internal
  - job_name: 'visioeval'
    static_configs:
      - targets: ['172.17.0.1:8000']
    scrape_interval: 10s

  # Flink JobManager metrics
  - job_name: 'flink'
    static_configs:
      - targets: ['flink-jobmanager:8081']
    metrics_path: /metrics

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
