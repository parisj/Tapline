# Promtail configuration for VisioEval
# Collects logs from Docker containers and sends to Loki

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Scrape Docker container logs
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Add job label (required by Loki)
      - replacement: docker
        target_label: job

      # Only collect logs from containers with a name
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'

      # Add container ID label
      - source_labels: ['__meta_docker_container_id']
        target_label: 'container_id'

      # Add image name label
      - source_labels: ['__meta_docker_container_image']
        target_label: 'image'

      # Filter to only include VisioEval-related containers
      - source_labels: ['__meta_docker_container_name']
        regex: '/(kafka|zookeeper|flink.*|minio|prometheus|grafana|jaeger|loki|schema-registry|promtail)'
        action: keep

    pipeline_stages:
      # Parse JSON logs from VisioEval pipeline
      - json:
          expressions:
            level: level
            logger: logger
            message: message
            timestamp: timestamp
            thread: thread

      # Extract labels from JSON fields
      - labels:
          level:
          logger:
          thread:

      # Set timestamp from JSON field if present
      - timestamp:
          source: timestamp
          format: RFC3339Nano
          fallback_formats:
            - "2006-01-02T15:04:05.000000-07:00"
            - "2006-01-02T15:04:05.000000Z"

      # Drop empty messages
      - drop:
          expression: '^\s*$'
          drop_counter_reason: empty_message

  # Scrape VisioEval pipeline logs from stdout (when run locally)
  # This requires piping pipeline output to a log file
  - job_name: visioeval-pipeline
    static_configs:
      - targets:
          - localhost
        labels:
          job: visioeval
          __path__: /var/log/visioeval/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            logger: logger
            message: message
            timestamp: timestamp
      - labels:
          level:
          logger:
      - timestamp:
          source: timestamp
          format: RFC3339Nano
