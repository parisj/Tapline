# ============================================================================
# Directory → Algorithm routing configuration
#
# Each [route.<directory_key>] defines:
# - which algorithm to run
# - which algorithm version
# - which settings file to load
#
# [route.pathXX]
# algorithm = "name_algo"
# version = "X.X.X"
# settings = "algorithms/pathXX"
#
# The directory_key MUST match the key used by the DirectoryObserver.
# ============================================================================

[route.path0]
algorithm = "analysis_probe"
version = "1.0.0"
settings = "algorithms/algo_template.toml"

[route.path1]
algorithm = "model_inference"
version = "0.1.0"
settings = "algorithms/model_template.toml"

[route.path2]
algorithm = "blob_detection"
version = "1.0.0"
settings = "algorithms/blob_detection.toml"

[route.path3]
algorithm = "image_quality"
version = "1.0.0"
settings = "algorithms/image_quality.toml"

[route.path4]
algorithm = "edge_detection"
version = "1.0.0"
settings = "algorithms/edge_detection.toml"

[route.path5]
algorithm = "histogram_analysis"
version = "1.0.0"
settings = "algorithms/histogram_analysis.toml"

[route.path6]
algorithm = "contour_analysis"
version = "1.0.0"
settings = "algorithms/contour_analysis.toml"

[route.path7]
algorithm = "model_yolo_segmentation"
version = "1.0.0"
settings = "algorithms/yolo_segmentation.toml"

